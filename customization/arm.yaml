# Run the following command to generate the image id
# curl -s -X POST --data-binary @/customization/arm.yaml https://factory.talos.dev/schematics | cut -d\" -f4
customization:
  extraKernelArgs:
    - -net.ifnames
    - net.ifnames=0
overlay:
  image: siderolabs/sbc-raspberrypi
  name: rpi_generic
  options:
    configTxtAppend: |
      [cm4]
      enable_uart=1
      dtoverlay=uart5
      dtparam=i2c_arm=on
      dtoverlay=i2c-rtc,ds3231
