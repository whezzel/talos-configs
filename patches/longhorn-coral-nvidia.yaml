# talos01, talos02
machine:
  install:
    # Run the following command to generate the image id
    # curl -s -X POST --data-binary @customization/longhorn-coral-nvidia.yaml https://factory.talos.dev/schematics | cut -d\" -f4
    image: factory.talos.dev/installer/37ef0d2b95c560e26da45bc5423e04b5e24b3bb7f03309b28de28d8140ce72fb:v1.10.0
  kernel:
    modules:
      - name: apex
      - name: gasket
      - name: nvidia
      - name: nvidia_uvm
      - name: nvidia_drm
      - name: nvidia_modeset
  udev:
    rules:
      - SUBSYSTEM=="apex", MODE="0660", GROUP="44"
  sysctls:
    net.core.bpf_jit_harden: 1
