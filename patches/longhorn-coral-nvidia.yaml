# talos01, talos02
machine:
  install:
    # Run the following command to generate the image id
    # curl -s -X POST --data-binary @/home/zach/repos/talos/customization/longhorn-coral-nvidia.yaml https://factory.talos.dev/schematics | cut -d\" -f4
    image: factory.talos.dev/installer/007aea1de0b069744efc72baa8b68f3c88024c7e90f2334de00f7bb545ce97d5:v1.9.5
  kernel:
    modules:
      - name: apex
      - name: gasket
      - name: nvidia
      - name: nvidia_uvm
      - name: nvidia_drm
      - name: nvidia_modeset
  udev:
    rules:
      - SUBSYSTEM=="apex", MODE="0660", GROUP="44"
  sysctls:
    net.core.bpf_jit_harden: 1
