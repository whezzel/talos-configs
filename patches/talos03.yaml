kind: UnattendedInstallConfig
provisioning:
  diskSelector:
    match: disk.wwid == "eui.001b444a46e72038"
---
apiVersion: v1alpha1
kind: HostnameConfig
auto: off
hostname: talos03
---
apiVersion: v1alpha1
kind: KubeNodeConfig
