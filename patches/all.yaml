cluster:
  clusterName: prod
machine:
  kubelet:
    extraArgs:
      rotate-server-certificates: true
    extraMounts:
      - destination: /var/mnt/longhorn
        type: bind
        source: /var/mnt/longhorn
        options:
          - bind
          - rshared
          - rw
      - destination: /var/mnt/storage
        type: bind
        source: /var/mnt/storage
        options:
          - bind
          - rshared
          - rw
  install:
    diskSelector:
        size: '>=64GB'
        model: Flash Drive FIT
    wipe: true
  network:
    extraHostEntries:
      - ip: 10.69.20.10
        aliases:
          - talos-api.whezzel.com
      - ip: 10.69.20.11
        aliases:
          - talos01
          - talos01.whezzel.com
      - ip: 10.69.20.12
        aliases:
          - talos02
          - talos02.whezzel.com
      - ip: 10.69.20.13
        aliases:
          - talos03
          - talos03.whezzel.com
      - ip: 10.69.20.14
        aliases:
          - talos04
          - talos04.whezzel.com
      - ip: 10.69.20.15
        aliases:
          - talos05
          - talos05.whezzel.com
