machine:
  certSANs:
    - talos-api.whezzel.com
  network:
    interfaces:
      - interface: eth0
        dhcp: true
        vip:
          ip: 10.69.20.10
  install:
    disk: /dev/nvme0n1
    extraKernelArgs:
      - -net.ifnames
      - net.ifnames=0
    # Run the following command to generate the image id
    # curl -s -X POST --data-binary @customization/arm.yaml https://factory.talos.dev/schematics | cut -d\" -f4
    # download image: wget -c https://factory.talos.dev/image/$(curl -s -X POST --data-binary @customization/arm.yaml https://factory.talos.dev/schematics | cut -d\" -f4)/v1.11.0/metal-arm64.raw.xz -O metal-arm64-raw-1.10.6.raw.xz
    # extract with xz and flash with rpi-imager
    image: factory.talos.dev/metal-installer/6239a2f1b0b4a18d7bd33df17e028e8f32cbe1a8e296179d9985dcdc1df2ea1e:v1.11.0
    wipe: false
  kernel:
    modules:
      - name: i2c-dev
      - name: rtc-ds1307
cluster:
  network:
    cni:
      name: none
  controllerManager:
    extraArgs:
      bind-address: 0.0.0.0
  proxy:
    disabled: true
  scheduler:
    extraArgs:
      bind-address: 0.0.0.0
  extraManifests:
    - https://raw.githubusercontent.com/alex1989hu/kubelet-serving-cert-approver/main/deploy/standalone-install.yaml
    - https://github.com/kubernetes-sigs/metrics-server/releases/latest/download/components.yaml
  allowSchedulingOnControlPlanes: false
