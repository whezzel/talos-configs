cluster:
  network:
    cni:
      name: none
  proxy:
    disabled: true
  extraManifests:
    - https://raw.githubusercontent.com/alex1989hu/kubelet-serving-cert-approver/main/deploy/standalone-install.yaml
    - https://github.com/kubernetes-sigs/metrics-server/releases/latest/download/components.yaml
  allowSchedulingOnControlPlanes: false
  controllerManager:
    extraArgs:
      bind-address: 0.0.0.0
  scheduler:
    extraArgs:
      bind-address: 0.0.0.0
#  apiServer:
#    certSANs:
#      - talos-api.whezzel.com
machine:
  certSANs:
    - talos-api.whezzel.com
  install:
    # Run the following command to generate the image id
    # curl -s -X POST --data-binary @customization/arm.yaml https://factory.talos.dev/schematics | cut -d\" -f4
    # download image: wget https://factory.talos.dev/image/$(curl -s -X POST --data-binary @customization/arm.yaml https://factory.talos.dev/schematics | cut -d\" -f4)/v1.10.5/metal-arm64.raw.xz
    # extract with xz and flash with rpi-imager
    image: factory.talos.dev/metal-installer/6239a2f1b0b4a18d7bd33df17e028e8f32cbe1a8e296179d9985dcdc1df2ea1e:v1.10.6
    disk: /dev/nvme0n1
    wipe: false
    extraKernelArgs:
      - -net.ifnames
      - net.ifnames=0
  network:
    interfaces:
    - interface: eth0
      dhcp: true
      vip:
        ip: 10.69.20.10
  kernel:
    modules:
      - name: i2c-dev
      - name: rtc-ds1307
