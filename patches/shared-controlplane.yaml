machine:
  certSANs:
    - talos-api.whezzel.com
  install:
    extraKernelArgs:
      - -net.ifnames
      - net.ifnames=0
    # Run the following command to generate the image id
    # curl -s -X POST --data-binary @customization/arm.yaml https://factory.talos.dev/schematics | jq -r '.id'
    # download image: wget -c https://factory.talos.dev/image/$(curl -s -X POST --data-binary @customization/arm.yaml https://factory.talos.dev/schematics | jq -r '.id')/v1.11.1/metal-arm64.raw.xz -O metal-arm64-raw-1.10.6.raw.xz
    # extract with xz and flash with rpi-imager
    image: harbor.whezzel.com/factory.talos.dev/metal-installer/6700767ba5f9fb4e77a08c64b0706c6bd6dc8d2579cda35df7c11e3b04eb5716:v1.13.5
    grubUseUKICmdline: false
  kernel:
    modules:
      - name: i2c-dev
      - name: rtc-ds1307
cluster:
  network:
    cni:
      name: none
  controllerManager:
    extraArgs:
      bind-address: 0.0.0.0
  proxy:
    disabled: true
  scheduler:
    extraArgs:
      bind-address: 0.0.0.0
  extraManifests:
    - https://raw.githubusercontent.com/alex1989hu/kubelet-serving-cert-approver/main/deploy/standalone-install.yaml
    - https://github.com/kubernetes-sigs/metrics-server/releases/latest/download/components.yaml
  allowSchedulingOnControlPlanes: false
---
apiVersion: v1alpha1
kind: Layer2VIPConfig
name: 10.69.20.10
link: eth0
---
apiVersion: v1alpha1
kind: DHCPv4Config
name: eth0
clientIdentifier: mac
ignoreHostname: true
