machine:
  kubelet:
    extraArgs:
      rotate-server-certificates: "true"
    nodeIP:
      validSubnets:
        - 10.69.20.0/24
  install:
    wipe: true
  network:
    extraHostEntries:
      - ip: 10.69.20.10
        aliases:
          - talos-api.whezzel.com
      - ip: 10.69.20.11
        aliases:
          - talos01
          - talos01.whezzel.com
      - ip: 10.69.20.12
        aliases:
          - talos02
          - talos02.whezzel.com
      - ip: 10.69.20.13
        aliases:
          - talos03
          - talos03.whezzel.com
      - ip: 10.69.20.14
        aliases:
          - talos04
          - talos04.whezzel.com
      - ip: 10.69.20.15
        aliases:
          - talos05
          - talos05.whezzel.com
      - ip: 10.69.20.16
        aliases:
          - talos06
          - talos06.whezzel.com
      - ip: 10.69.20.17
        aliases:
          - talos07
          - talos07.whezzel.com
      - ip: 10.69.20.18
        aliases:
          - talos08
          - talos08.whezzel.com
  registries:
    mirrors:
      docker.io:
          endpoints:
              - https://harbor.whezzel.com/v2/docker.io
          overridePath: true
      factory.talos.dev:
          endpoints:
              - https://harbor.whezzel.com/v2/factory.talos.dev
          overridePath: true
      gcr.io:
          endpoints:
              - https://harbor.whezzel.com/v2/gcr.io
          overridePath: true
      ghcr.io:
          endpoints:
              - https://harbor.whezzel.com/v2/ghcr.io
          overridePath: true
      lscr.io:
          endpoints:
              - https://harbor.whezzel.com/v2/lscr.io
          overridePath: true
      quay.io:
          endpoints:
              - https://harbor.whezzel.com/v2/quay.io
          overridePath: true
      registry.k8s.io:
          endpoints:
              - https://harbor.whezzel.com/v2/registry.k8s.io
          overridePath: true
cluster:
  clusterName: prod
---
apiVersion: v1alpha1
kind: DHCPv4Config
name: eth0
clientIdentifier: mac
ignoreHostname: true
---
apiVersion: v1alpha1
kind: DHCPv6Config
name: eth0
clientIdentifier: mac
