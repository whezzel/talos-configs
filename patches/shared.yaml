          - talos02
          - talos02.whezzel.com
      - ip: 10.69.20.13
        aliases:
          - talos03
          - talos03.whezzel.com
      - ip: fd69:0:0:20::13
        aliases:
          - talos03
          - talos03.whezzel.com
      - ip: 10.69.20.14
        aliases:
          - talos04
          - talos04.whezzel.com
