        aliases:
          - talos05
          - talos05.whezzel.com
      - ip: 10.69.20.16
        aliases:
          - talos06
          - talos06.whezzel.com
      - ip: fd69:0:0:20::16
        aliases:
          - talos06
          - talos06.whezzel.com
      - ip: 10.69.20.17
        aliases:
          - talos07
          - talos07.whezzel.com
      - ip: fd69:0:0:20::17
        aliases:
          - talos07
          - talos07.whezzel.com
      - ip: 10.69.20.18
        aliases:
          - talos08
          - talos08.whezzel.com
      - ip: fd69:0:0:20::18
        aliases:
          - talos08
          - talos08.whezzel.com
  registries:
    mirrors:
      docker.io:
          endpoints:
              - https://harbor.whezzel.com/v2/docker.io
          overridePath: true
      factory.talos.dev:
          endpoints:
              - https://harbor.whezzel.com/v2/factory.talos.dev
          overridePath: true
      gcr.io:
          endpoints:
              - https://harbor.whezzel.com/v2/gcr.io
          overridePath: true
      ghcr.io:
          endpoints:
              - https://harbor.whezzel.com/v2/ghcr.io
          overridePath: true
      lscr.io:
          endpoints:
              - https://harbor.whezzel.com/v2/lscr.io
          overridePath: true
      quay.io:
          endpoints:
              - https://harbor.whezzel.com/v2/quay.io
          overridePath: true
      registry.k8s.io:
          endpoints:
              - https://harbor.whezzel.com/v2/registry.k8s.io
          overridePath: true
cluster:
  clusterName: prod
  network:
    podSubnets:
      - 10.244.0.0/16
      - fd69:0:244::/56
    serviceSubnets:
      - 10.96.0.0/12
      - fd69:0:96::/112
---
apiVersion: v1alpha1
kind: DHCPv4Config
name: eth0
clientIdentifier: mac
ignoreHostname: true
---
apiVersion: v1alpha1
kind: DHCPv6Config
name: eth0
clientIdentifier: mac
---
apiVersion: v1alpha1
kind: RoutingRuleConfig
name: "2000"
src: 10.69.21.0/24
dst: 10.244.0.0/16
table: main
action: unicast
---
apiVersion: v1alpha1
kind: RoutingRuleConfig
name: "2001"
