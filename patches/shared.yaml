dst: 10.69.0.0/16
table: main
action: unicast
---
apiVersion: v1alpha1
kind: RoutingRuleConfig
name: "2002"
src: fd69:0:0:21::/64
dst: fd69:0:244::/56
table: main
action: unicast
---
