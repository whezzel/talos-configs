machine:
  kubelet:
    extraArgs:
      rotate-server-certificates: "true"
    nodeIP:
      validSubnets:
        - 10.69.20.0/24
        - fd69:0:0:20::/64
  sysctls:
    net.ipv6.conf.eth0.accept_ra: "2"
  install:
    wipe: true
  network:
    extraHostEntries:
      - ip: 10.69.20.10
        aliases:
          - talos-api.whezzel.com
      - ip: 10.69.20.11
        aliases:
