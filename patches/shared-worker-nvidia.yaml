machine:
  install:
    # Run the following command to generate the image id
    # curl -s -X POST --data-binary @customization/longhorn-coral-nvidia.yaml https://factory.talos.dev/schematics | cut -d\" -f4
    image: factory.talos.dev/metal-installer-secureboot/2ccb2b7456df7435281a6691b2eb0da3ce16dccad61307b364d5d514d2b34a6a:v1.10.6
  kernel:
    modules:
      - name: apex
      - name: gasket
      - name: nvidia
      - name: nvidia_uvm
      - name: nvidia_drm
      - name: nvidia_modeset
  udev:
    rules:
      - SUBSYSTEM=="apex", MODE="0660", GROUP="44"
  sysctls:
    net.core.bpf_jit_harden: 1
