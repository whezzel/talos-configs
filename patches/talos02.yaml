machine:
  certSANs:
    - talos02
    - talos02.whezzel.com
---
apiVersion: v1alpha1
kind: UnattendedInstallConfig
provisioning:
  diskSelector:
    match: disk.wwid == "eui.0025385a31906264"
---
apiVersion: v1alpha1
kind: HostnameConfig
auto: off
hostname: talos02
---
apiVersion: v1alpha1
kind: KubeNodeConfig
labels:
  nvidia-present: "false"
  coral-present: "false"
  rtlsdr-present: "false"
---
apiVersion: v1alpha1
kind: KubeAPIServerConfig
certExtraSANs:
  - talos02
  - talos02.whezzel.com
---
apiVersion: v1alpha1
kind: VLANConfig
name: eth0.21
vlanID: 21
vlanMode: 802.1q
parent: eth0
up: true
addresses:
  - address: 10.69.21.12/24
  - address: fd69:0:0:21::12/64
routes:
  - gateway: 10.69.21.1
    table: "21"
  - gateway: fd69:0:0:21::1
    table: "21"
