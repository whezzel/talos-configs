machine:
  certSANs:
    - talos04.whezzel.com
---
apiVersion: v1alpha1
kind: UnattendedInstallConfig
provisioning:
  diskSelector:
    match: disk.wwid == "naa.500a0751e8abf858"
---
apiVersion: v1alpha1
kind: HostnameConfig
auto: off
hostname: talos04
---
apiVersion: v1alpha1
kind: KubeNodeConfig
labels:
  nvidia-present: "false"
  coral-present: "false"
  rtlsdr-present: "false"
---
apiVersion: v1alpha1
kind: VLANConfig
name: eth0.21
vlanID: 21
vlanMode: 802.1q
parent: eth0
up: true
addresses:
  - address: 10.69.21.14/24
  - address: fd69:0:0:21::14/64
routes:
  - gateway: 10.69.21.1
    table: "21"
  - gateway: fd69:0:0:21::1
    table: "21"
---
apiVersion: v1alpha1
kind: UserVolumeConfig
name: longhorn
provisioning:
  diskSelector:
    match: disk.wwid == "nvme.1987-3438373930343539353033323332-53616272656e742053422d524f434b45542d4e564d65342d315442-00000001"
  minSize: 1GB
